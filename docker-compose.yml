services:
  # --- Infrastructure ---
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: scholarship_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Migration (รันครั้งเดียวแล้วจบ) ---
  migrate:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./service-auth/prisma:/app/prisma
      - ./service-auth/package.json:/app/package.json
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/scholarship_db
    command: sh -c "npm install prisma --no-save && npx prisma migrate deploy"
    depends_on:
      postgres:
        condition: service_healthy

  # --- Services ---
  service-landing:
    build: ./service-landing
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://service-auth:3001
      - CORE_SERVICE_URL=http://service-core:3003
      - ANALYTICS_SERVICE_URL=http://service-analytics:3004
      - NOTIFICATION_SERVICE_URL=http://service-notification:3005
    depends_on:
      - service-auth

  service-auth:
    build: ./service-auth
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/scholarship_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change-this-in-production
      - INTERNAL_SECRET=internal-secret-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  service-ingestion:
    build: ./service-ingestion
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/scholarship_db
      - INTERNAL_SECRET=internal-secret-key
      - NOTIFICATION_SERVICE_URL=http://service-notification:3005
    depends_on:
      migrate:
        condition: service_completed_successfully

  service-core:
    build: ./service-core
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/scholarship_db
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://service-auth:3001
      - INTERNAL_SECRET=internal-secret-key
    depends_on:
      migrate:
        condition: service_completed_successfully
      service-auth:
        condition: service_started

  service-analytics:
    build: ./service-analytics
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://service-auth:3001
      - CORE_SERVICE_URL=http://service-core:3003
      - INTERNAL_SECRET=internal-secret-key
    depends_on:
      service-auth:
        condition: service_started
      service-core:
        condition: service_started

  service-notification:
    build: ./service-notification
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/scholarship_db
      - AUTH_SERVICE_URL=http://service-auth:3001
      - INTERNAL_SECRET=internal-secret-key
      - SMTP_HOST=smtp.example.com
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASS=
    depends_on:
      migrate:
        condition: service_completed_successfully
      service-auth:
        condition: service_started

volumes:
  postgres_data: