

services:
  # ─── Infrastructure ───────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: scholarship_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ─── Services ─────────────────────────────────────────────────
  service-landing:
    build: ./service-landing
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - AUTH_SERVICE_URL=http://service-auth:3001
      - INGESTION_SERVICE_URL=http://service-ingestion:3002
      - CORE_SERVICE_URL=http://service-core:3003
      - ANALYTICS_SERVICE_URL=http://service-analytics:3004
      - NOTIFICATION_SERVICE_URL=http://service-notification:3005
    depends_on:
      - service-auth

  service-auth:
    build: ./service-auth
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/scholarship_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change-this-in-production
      - INTERNAL_SECRET=internal-secret-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  service-ingestion:
    build: ./service-ingestion
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/scholarship_db
      - INTERNAL_SECRET=internal-secret-key
      - CORE_SERVICE_URL=http://service-core:3003
      - NOTIFICATION_SERVICE_URL=http://service-notification:3005
    depends_on:
      postgres:
        condition: service_healthy

  service-core:
    build: ./service-core
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/scholarship_db
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://service-auth:3001
      - INTERNAL_SECRET=internal-secret-key
      - NOTIFICATION_SERVICE_URL=http://service-notification:3005
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      service-auth:
        condition: service_started

  service-analytics:
    build: ./service-analytics
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/scholarship_db
      - AUTH_SERVICE_URL=http://service-auth:3001
      - CORE_SERVICE_URL=http://service-core:3003
      - INTERNAL_SECRET=internal-secret-key
    depends_on:
      postgres:
        condition: service_healthy
      service-auth:
        condition: service_started

  service-notification:
    build: ./service-notification
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/scholarship_db
      - AUTH_SERVICE_URL=http://service-auth:3001
      - INTERNAL_SECRET=internal-secret-key
      - SMTP_HOST=smtp.ethereal.email
      - SMTP_PORT=587
      - SMTP_USER=nolan.haag@ethereal.email
      - SMTP_PASS=smPnMhV8RqzYfSPkYa
    depends_on:
      postgres:
        condition: service_healthy
      service-auth:
        condition: service_started

volumes:
  postgres_data:
